# TokenDance Field（情报引擎）—— 宿主 nginx 配置
# 放到 /etc/nginx/conf.d/infoget.tokenplaza.cc.conf
#
# 只写 80 段。443 和证书路径由 certbot 自己追加——手写会和 certbot 的改写冲突，
# 服务器上另外几个站的 .conf 都是这个形状。
#
# 同一个容器（127.0.0.1:8021）还挂着 www.field.tokendance.cool。两个域名共存，
# 不是迁移：老域名还有人在用，撤掉等于悄悄把别人的链接改死。
server {
    listen 80;
    listen [::]:80;
    server_name infoget.tokenplaza.cc;

    client_max_body_size 8m;
    access_log /var/log/nginx/infoget.access.log;
    error_log  /var/log/nginx/infoget.error.log;

    location / {
        proxy_pass http://127.0.0.1:8021;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # 抓取和抽取是同步跑的，一次采集能跑到分钟级。默认 60s 会在管线还活着的时候
        # 给前端一个 504，看起来像功能坏了。
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
